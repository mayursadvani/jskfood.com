<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 150" fill="none">
  <defs>
    <linearGradient id="leafGrad1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9CCF5A"/>
      <stop offset="1" stop-color="#6FA82E"/>
    </linearGradient>
    <linearGradient id="leafGrad2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#B4E27A"/>
      <stop offset="1" stop-color="#80C341"/>
    </linearGradient>
    <linearGradient id="jskGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C22A3F"/>
      <stop offset="1" stop-color="#8E1A2B"/>
    </linearGradient>
  </defs>

  <!-- Twin-leaf sprout -->
  <g transform="translate(58,8)">
    <path d="M2 62 C -4 40, 4 16, 26 0 C 30 22, 26 44, 8 60 C 6 61, 4 62, 2 62 Z" fill="url(#leafGrad1)"/>
    <path d="M22 66 C 18 48, 24 30, 40 18 C 43 34, 40 52, 26 66 C 25 67, 23 67, 22 66 Z" fill="url(#leafGrad2)"/>
    <path d="M6 58 C 10 46, 16 34, 24 24" stroke="#4C8A1F" stroke-width="2.2" stroke-linecap="round" fill="none"/>
    <path d="M25 64 C 28 52, 32 42, 38 32" stroke="#5C9A28" stroke-width="2" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Orange bracket frame -->
  <path d="M14 78 L14 132 L96 132" stroke="#F5821F" stroke-width="5" fill="none" stroke-linecap="square"/>
  <path d="M472 78 L472 132 L390 132" stroke="#F5821F" stroke-width="5" fill="none" stroke-linecap="square"/>

  <!-- JSK wordmark -->
  <text x="252" y="122" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="108" fill="url(#jskGrad)" letter-spacing="-2">JSK</text>

  <!-- ENTERPRISES -->
  <text x="252" y="147" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="19" fill="#231F20" letter-spacing="7">ENTERPRISES</text>
</svg>
